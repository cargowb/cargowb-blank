<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бланк заказа Cargowb</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 15px; background: #f5f7fa; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; text-align: center; color: #1c1c1e; }
        .item-row { border-bottom: 2px dashed #e5e5ea; padding-bottom: 15px; margin-bottom: 15px; position: relative; }
        .item-title { font-weight: bold; margin-bottom: 10px; color: #007aff; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #d1d1d6; border-radius: 6px; font-size: 14px; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-add { background-color: #34c759; color: white; }
        .btn-add:hover { background-color: #28a745; }
        .btn-send { background-color: #24A1DE; color: white; margin-top: 20px; }
        .btn-send:hover { background-color: #1a84b8; }
        .summary { background: #f1f2f6; padding: 15px; border-radius: 8px; margin-top: 20px; font-size: 16px; }
        .summary div { margin-bottom: 5px; }
        .total-price { font-size: 18px; font-weight: bold; color: #ff3b30; }
        .delete-btn { color: #ff3b30; background: none; border: none; cursor: pointer; float: right; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Бланк заказа Cargowb</h2>
        
        <form id="orderForm">
            <div id="itemsContainer"></div>

            <button type="button" class="btn btn-add" onclick="addItem()">➕ Добавить товар в заказ</button>

            <div class="summary">
                <div>Стоимость товаров (с доставкой по КНР): <span id="subtotal">0</span> ¥</div>
                <div>Наша комиссия (7%): <span id="commission">0</span> ¥</div>
                <div class="total-price">Итого к оплате: <span id="total">0</span> ¥</div>
            </div>

            <button type="submit" class="btn btn-send">💬 Отправить список в Telegram</button>
        </form>
    </div>

    <script>
        // Ваш юзернейм уже прописан здесь жестко и правильно
        const RECIPIENT = 'cargowb1'; 
        
        let itemCount = 0;

        function addItem() {
            itemCount++;
            const container = document.getElementById('itemsContainer');
            
            const itemHtml = `
                <div class="item-row" id="item_${itemCount}">
                    <button type="button" class="delete-btn" onclick="removeItem(${itemCount})">❌ Удалить</button>
                    <div class="item-title">Товар №${itemCount}</div>
                    
                    <label>Ссылка на товар:</label>
                    <input type="url" class="prod-link" placeholder="https://1688.com..." required>
                    
                    <div class="row-grid">
                        <div>
                            <label>Цена за 1 шт (¥):</label>
                            <input type="number" class="prod-price" step="0.01" placeholder="0.00" oninput="calculateTotal()" required>
                        </div>
                        <div>
                            <label>Количество (шт):</label>
                            <input type="number" class="prod-qty" value="1" min="1" oninput="calculateTotal()" required>
                        </div>
                    </div>

                    <div class="row-grid">
                        <div>
                            <label>Цвет / Размер / Параметры:</label>
                            <input type="text" class="prod-meta" placeholder="Черный, XL" required>
                        </div>
                        <div>
                            <label>Доставка по Китаю (¥):</label>
                            <input type="number" class="prod-delivery" step="0.01" value="0" placeholder="0.00" oninput="calculateTotal()" required>
                        </div>
                    </div>

                    <label>Ссылка на фото товара (если есть):</label>
                    <input type="url" class="prod-photo" placeholder="https://...">
                </div>
            `;
            container.insertAdjacentHTML('beforeend', itemHtml);
            calculateTotal();
        }

        function removeItem(id) {
            const item = document.getElementById('item_' + id);
            if (item) {
                item.remove();
                calculateTotal();
            }
        }

        function calculateTotal() {
            let subtotal = 0;
            const rows = document.querySelectorAll('.item-row');

            rows.forEach(function(row) {
                const price = parseFloat(row.querySelector('.prod-price').value) || 0;
                const qty = parseInt(row.querySelector('.prod-qty').value) || 0;
                const delivery = parseFloat(row.querySelector('.prod-delivery').value) || 0;
                subtotal += (price * qty) + delivery;
            });

            const commission = subtotal * 0.07;
            const total = subtotal + commission;

            document.getElementById('subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('commission').innerText = commission.toFixed(2);
            document.getElementById('total').innerText = total.toFixed(2);
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const rows = document.querySelectorAll('.item-row');
            if (rows.length === 0) {
                alert('Добавьте хотя бы один товар!');
                return;
            }

            let text = '📦 НОВЫЙ ЗАКАЗ CARGOWB\n\n';
            
            rows.forEach(function(row, index) {
                const link = row.querySelector('.prod-link').value;
                const price = row.querySelector('.prod-price').value;
                const qty = row.querySelector('.prod-qty').value;
                const meta = row.querySelector('.prod-meta').value;
                const delivery = row.querySelector('.prod-delivery').value;
                const photo = row.querySelector('.prod-photo').value;

                text += '🔹 Товар №' + (index + 1) + '\n';
                text += '🔗 Ссылка: ' + link + '\n';
                text += '🎨 Характеристики: ' + meta + '\n';
                text += '💰 Цена: ' + price + ' ¥ | 🔢 Кол-во: ' + qty + ' шт\n';
                text += '🚚 Доставка по КНР: ' + delivery + ' ¥\n';
                if (photo.trim() !== '') {
                    text += '📸 Фото: ' + photo + '\n';
                }
                text += '\n';
            });

            const subtotal = document.getElementById('subtotal').innerText;
            const commission = document.getElementById('commission').innerText;
            const total = document.getElementById('total').innerText;

            text += '📈 ИТОГО:\n';
            text += 'Сумма товаров: ' + subtotal + ' ¥\n';
            text += 'Комиссия (7%): ' + commission + ' ¥\n';
            text += '💵 К оплате: ' + total + ' ¥';

            const encodedText = encodeURIComponent(text);
            
            // Ссылка «Поделиться», которая перенаправляет в этом же окне на ваш личный аккаунт cargowb1
            const telegramUrl = 'https://t.me' + RECIPIENT + '&text=' + encodedText;
            
            // Мгновенный переход без открытия заблокированных браузером вкладок
            window.location.href = telegramUrl;
        });

        addItem();
    </script>
</body>
</html>
